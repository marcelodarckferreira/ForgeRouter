services:
  forgerouter:
    build:
      context: .
      dockerfile: Dockerfile
    image: forgerouter:latest
    container_name: forgerouter
    network_mode: host
    env_file:
      - .env
    volumes:
      # Codex CLI login (read-only): the OpenAI Codex plan handler resolves its
      # OAuth token from here automatically — no token is stored in the registry.
      - ~/.codex:/root/.codex:ro
      # Antigravity (agy) CLI login (read-only): the Google Antigravity plan
      # handler resolves its OAuth token from here automatically.
      - ~/.gemini:/root/.gemini:ro
      # Claude Code CLI login (read-only, single file — avoids exposing the
      # CLI's conversation history/session data): the Claude Code plan
      # handler resolves its OAuth token from here automatically.
      - ~/.claude/.credentials.json:/root/.claude/.credentials.json:ro
      # Z.ai approved login/CLI token (read-only): the Z.ai plan handler resolves
      # its OAuth/session access token from ~/.zai/auth.json when present.
      - ~/.zai:/root/.zai:ro
      # DeepSeek web credentials/token (read-only): the native subscription
      # handler reads ~/.deepseek/auth.json when present.
      - ~/.deepseek:/root/.deepseek:ro
      # Reference-cost pricing catalogs (read-write): POST /admin/pricing/sync
      # rewrites these from inside the container (app/pricing.py). Without a
      # bind mount here the sync result only lives in the container's writable
      # layer and is lost on the next --build/recreate — mount them so a sync
      # actually persists across deploys, the same way the repo file does.
      - ./config/model_pricing.json:/app/config/model_pricing.json
      - ./config/model_pricing_live.json:/app/config/model_pricing_live.json
      # --- Agent deploy-config + systemd/D-Bus client sockets: see docker-compose.yml
      # for the full rationale (db/036_agent_deploy_config.sql, rotate-key auto-apply).
      - ~/.hermes/profiles:/root/.hermes/profiles
      - ~/.claude/.env:/root/.claude/.env
      - ~/.codex/.env:/root/.codex/.env
      - ~/.gemini/config/.env:/root/.gemini/config/.env
      - ~/.openclaw/.env:/root/.openclaw/.env
      - /run/systemd:/run/systemd
      - /run/dbus:/run/dbus
    pid: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2100/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Notes:
# - network_mode: host is required while Ollama listens only on 127.0.0.1:11434 on the host.
# - PostgreSQL remains the Foundation-managed database at foundation_postgres.
# - Secrets must stay in .env and must not be committed.
